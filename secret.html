<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Secret Box 🔐</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Segoe UI,sans-serif;
    background:
    radial-gradient(circle at center,#432754,#171020 55%,#08060c);
    color:white;
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.lock{
    font-size:100px;
    cursor:pointer;
    transition:.5s;
    filter:drop-shadow(0 0 25px #d78cff);
}

.lock:hover{
    transform:scale(1.1) rotate(-5deg);
}

h1{
    font-size:clamp(35px,7vw,60px);
    margin:25px 0 15px;
}

p{
    color:#d8cedf;
    max-width:500px;
    line-height:1.8;
}

.hint{
    margin-top:25px;
    font-size:13px;
    color:#bca7c9;
}

.message{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#08050dcc;
    backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:.8s;
    padding:20px;
}

.message.show{
    opacity:1;
    pointer-events:auto;
}

.box{
    text-align:center;
    width:min(500px,90vw);
    padding:45px 25px;
    border-radius:30px;
    background:linear-gradient(145deg,#33203e,#17101e);
    box-shadow:0 0 70px #d178ff44;
}

.box h2{
    font-size:35px;
    margin-bottom:20px;
}

.box p{
    margin-bottom:25px;
}

button{
    border:0;
    padding:15px 30px;
    border-radius:30px;
    background:linear-gradient(135deg,#f5b6ff,#ffd49b);
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

    <div class="lock" onclick="unlock()">
        🔐
    </div>

    <h1>A Secret For You</h1>

    <p>
        You made it this far...
        <br>
        but there is still one little box
        I haven't opened yet.
    </p>

    <div class="hint">
        Tap the lock ✨
    </div>

</div>

<div class="message" id="message">

    <div class="box">

        <h2>Unlocked. ♡</h2>

        <p>
            Okay Chellooo...
            <br><br>
            You've officially reached
            the end of this little world.
            <br><br>
            But I saved the biggest surprise
            for the very last page. 🎂
        </p>

        <button onclick="nextPage()">
            Open the final surprise 🎁
        </button>

    </div>

</div>

<script>

function unlock(){

    document
    .getElementById("message")
    .classList.add("show");

}

function nextPage(){

    location.href="final.html";

}

</script>

</body>
</html>
